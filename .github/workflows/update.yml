name: Update payload catalog
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    paths:
      - sources.json
      - update.py
      - payload_icons.py
      - .github/workflows/update.yml
permissions:
  contents: write
concurrency:
  group: catalog-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install image support
        run: python3 -m pip install 'Pillow>=11,<13'
      - name: Build catalog
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 update.py
      - name: Publish changed metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add payloads.json payloads_v2.json status.json icons.json unavailable.json
          git diff --cached --quiet || { git commit -m 'Refresh payload catalog'; git push; }
